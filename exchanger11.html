<style>

/* ---------- i18n ---------- */
const I18N={
en:{home:'Home',search_ph:'Search textbooks, cycles, lab coats, calculators...',list_item:'List an Item',sign_in:'Sign In',sign_up:'Sign Up',sign_out:'Sign Out',my_listings:'My Listings',saved:'Saved Items',requests:'Requests',messages:'Messages',notifications:'Notifications',profile:'My Profile',admin:'Moderation',all_items:'All Items',cat_Books:'Books & Notes',cat_Lab_Equipment:'Lab Equipment & Aprons',cat_Electronics:'Electronics & Calculators',cat_Cycles:'Cycles & Mobility',cat_Others:'Others',type:'Type',all_modes:'All Modes',Rent:'For Rent',Exchange:'For Exchange',Sale:'For Sale',sort:'Sort',newest:'Newest First',price_low:'Price: Low to High (₹)',price_high:'Price: High to Low (₹)',hero_1:'Exchange, Rent, or Buy from',hero_2:'Seniors & Batchmates',hero_sub:'Save money on semester books, lab coats, calculators and hostel cycles. Verified-email members, zero commission.',stat_active:'Active Listings',stat_students:'Members',stat_deals:'Completed Deals',stat_fee:'Platform Commission',load_more:'Load more',no_items:'No campus items found',no_items_sub:'Try clearing filters or list something yourself.',reset:'Reset Filters',campus:'Campus',all_colleges:'All colleges',my_college:'My college',location:'Pickup spot',semester:'Semester',branch:'Branch',max_price:'Max ₹',hide_sold:'Hide sold/closed',any:'Any',items_found:'items',view_deal:'View & Deal',st_available:'Available',st_reserved:'Reserved',st_rented:'Rented out',st_sold:'Sold',st_exchanged:'Exchanged',st_paused:'Paused',rs_pending:'Pending',rs_accepted:'Accepted',rs_active:'In use',rs_completed:'Completed',rs_declined:'Declined',rs_cancelled:'Cancelled',login_needed:'Please sign in with your college account to continue.',dark:'Dark mode',light:'Light mode',verified:'Verified student',safety:'Campus Safety',faq:'FAQ',terms:'Terms',privacy:'Privacy',more_filters:'Filters'},
hi:{home:'होम',search_ph:'किताबें, साइकिल, लैब कोट, कैलकुलेटर खोजें...',list_item:'सामान डालें',sign_in:'साइन इन',sign_up:'साइन अप',sign_out:'साइन आउट',my_listings:'मेरी लिस्टिंग',saved:'सेव किए गए',requests:'अनुरोध',messages:'संदेश',notifications:'सूचनाएँ',profile:'मेरी प्रोफ़ाइल',admin:'मॉडरेशन',all_items:'सभी सामान',cat_Books:'किताबें और नोट्स',cat_Lab_Equipment:'लैब सामान और एप्रन',cat_Electronics:'इलेक्ट्रॉनिक्स और कैलकुलेटर',cat_Cycles:'साइकिल और वाहन',cat_Others:'अन्य',type:'प्रकार',all_modes:'सभी',Rent:'किराये पर',Exchange:'अदला-बदली',Sale:'बिक्री',sort:'क्रम',newest:'नए पहले',price_low:'कीमत: कम से ज़्यादा (₹)',price_high:'कीमत: ज़्यादा से कम (₹)',hero_1:'अदला-बदली, किराया या खरीद',hero_2:'सीनियर्स और बैचमेट्स से',hero_sub:'सेमेस्टर की किताबें, लैब कोट, कैलकुलेटर और हॉस्टल साइकिल पर पैसे बचाएँ। ईमेल-वेरिफाइड सदस्य, कोई कमीशन नहीं।',stat_active:'सक्रिय लिस्टिंग',stat_students:'सदस्य',stat_deals:'पूरी हुई डील',stat_fee:'प्लेटफ़ॉर्म कमीशन',load_more:'और दिखाएँ',no_items:'कोई सामान नहीं मिला',no_items_sub:'फ़िल्टर हटाएँ या खुद कुछ लिस्ट करें।',reset:'फ़िल्टर रीसेट',campus:'कैंपस',all_colleges:'सभी कॉलेज',my_college:'मेरा कॉलेज',location:'मिलने की जगह',semester:'सेमेस्टर',branch:'ब्रांच',max_price:'अधिकतम ₹',hide_sold:'बिके हुए छिपाएँ',any:'कोई भी',items_found:'सामान',view_deal:'देखें और डील करें',st_available:'उपलब्ध',st_reserved:'रिज़र्व',st_rented:'किराये पर दिया',st_sold:'बिक गया',st_exchanged:'बदल लिया',st_paused:'रोका गया',rs_pending:'लंबित',rs_accepted:'स्वीकृत',rs_active:'उपयोग में',rs_completed:'पूरा',rs_declined:'अस्वीकृत',rs_cancelled:'रद्द',login_needed:'आगे बढ़ने के लिए अपने कॉलेज खाते से साइन इन करें।',dark:'डार्क मोड',light:'लाइट मोड',verified:'वेरिफाइड छात्र',safety:'कैंपस सुरक्षा',faq:'सवाल-जवाब',terms:'शर्तें',privacy:'गोपनीयता',more_filters:'फ़िल्टर'}
};
let lang=localStorage.getItem('exch2_lang')||'en';
const t=k=>{const L=I18N[lang]||I18N.en;return L[k]??I18N.en[k]??k};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const fmtDay=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const fmtDate=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const opts=(arr,sel,lf)=>arr.map(a=>`<option value="${esc(a)}" ${String(a)===String(sel)?'selected':''}>${esc(lf?lf(a):a)}</option>`).join('');
const catKey=c=>'cat_'+c.replace(/ /g,'_');
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
function hueOf(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
const avatar=(u,sz=40)=>`<span class="avatar" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.38)}px;background:hsl(${hueOf(u?u.id:'x')} 62% 42%)">${esc(initials(u?u.name:'?'))}</span>`;
function placeholderImg(cat){
  const g={Books:['#f97316','#6366f1','📚'],'Lab Equipment':['#10b981','#0ea5e9','🥼'],Electronics:['#6366f1','#ec4899','🧮'],Cycles:['#f59e0b','#ef4444','🚲'],Others:['#64748b','#0f172a','📦']}[cat]||['#64748b','#0f172a','📦'];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='600' height='450' viewBox='0 0 600 450'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${g[0]}'/><stop offset='1' stop-color='${g[1]}'/></linearGradient></defs><rect width='600' height='450' fill='url(#g)'/><text x='300' y='270' font-size='150' text-anchor='middle'>${g[2]}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const PH=placeholderImg('Others');
let toastTimer;
function toast(msg,kind='success'){
  $('toastMsg').textContent=msg;
  $('toastIcon').innerHTML=kind==='error'?'<i class="fa-solid fa-circle-exclamation text-rose-500"></i>':kind==='info'?'<i class="fa-solid fa-circle-info text-sky-500"></i>':'<i class="fa-solid fa-circle-check text-emerald-500"></i>';
  $('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3800);
}

/* ---------- DB layer (Cloud Server / LocalStorage Sync) ---------- */
const DB={
  get(k,d){try{const v=localStorage.getItem('exch2_'+k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem('exch2_'+k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem('exch2_'+k)}catch{}}
};
let S={};
const KEYS=['users','listings','requests','messages','reviews','reports','notifs','saved'];
function loadState(){KEYS.forEach(k=>S[k]=DB.get(k,k==='saved'?{}:[]));S.session=DB.get('session',null)}
function save(...ks){
  let ok=true;
  ks.forEach(k=>{if(!DB.set(k,S[k]))ok=false});
  if(window.location.protocol.startsWith('http')){
    const payload={keys:ks,data:{}};
    ks.forEach(k=>{payload.data[k]=S[k]});
    fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
  }
  return ok;
}
async function syncFromServer(){
  if(!window.location.protocol.startsWith('http'))return;
  try{
    const res=await fetch('/api/state');
    if(!res.ok)return;
    const data=await res.json();
    let changed=false;
    KEYS.forEach(k=>{
      if(data[k]&&JSON.stringify(data[k])!==JSON.stringify(S[k])){
        S[k]=data[k];DB.set(k,data[k]);changed=true;
      }
    });
    if(changed){
      renderChrome();
      if(state.view==='messages'){const v=$('msgInput')?$('msgInput').value:'';renderMessages();if(v&&$('msgInput'))$('msgInput').value=v}
      else if(state.view==='home'){renderGrid()}else{renderView()}
    }
  }catch(e){}
}
const state={view:'home',thread:null,detailImgs:[],cal:null,formImages:[],rv:0,pending:null};
const F={q:'',cat:'All',type:'all',sort:'newest',scope:'all',location:'all',sem:'all',branch:'all',maxPrice:'',hideSold:true,page:1};

/* ---------- lookups ---------- */
const userById=id=>S.users.find(u=>u.id===id);
const listingById=id=>S.listings.find(l=>l.id===id);
function currentUser(){
  const s=S.session;if(!s||s.exp<Date.now())return null;
  const u=userById(s.userId);if(!u||u.banned)return null;return u;
}
const isBlockedPair=(me,oid)=>{if(!me)return false;const o=userById(oid);return (me.blocked||[]).includes(oid)||!!(o&&(o.blocked||[]).includes(me.id))};
function ratingOf(uid2){const rs=S.reviews.filter(r=>r.targetId===uid2);const n=rs.length;return{n,avg:n?rs.reduce((a,r)=>a+r.rating,0)/n:0}}
function starsHtml(avg){let h='';for(let i=1;i<=5;i++)h+=`<i class="fa-solid fa-star ${avg>=i-.25?'star-on':'star-off'} text-[11px]"></i>`;return h}
function ratingHtml(uid2){const r=ratingOf(uid2);return r.n?`<span class="inline-flex items-center gap-1">${starsHtml(r.avg)}<span class="text-[11px] muted font-semibold">${r.avg.toFixed(1)} (${r.n})</span></span>`:'<span class="text-[11px] muted font-semibold">New seller</span>'}
function trustChips(u){
  if(!u)return '';const r=ratingOf(u.id);let h='';
  if(u.verified)h+=`<span class="chip c-teal"><i class="fa-solid fa-circle-check"></i>${esc(t('verified'))}</span>`;
  else if(u.emailVerified)h+=`<span class="chip c-blue"><i class="fa-solid fa-envelope-circle-check"></i>Email verified</span>`;
  if(r.n>=3&&r.avg>=4.5)h+=`<span class="chip c-yellow"><i class="fa-solid fa-trophy"></i>Top rated</span>`;
  return h;
}

/* ---------- seed (sample listings, clearly tagged) ---------- */
function seedIfEmpty(){
  const now=Date.now();

/* ---------- crypto / auth ---------- */
const b64=a=>btoa(String.fromCharCode(...a));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},key,256);
    return b64(new Uint8Array(bits));
  }
  let h=5381;const s=salt+pw;for(let i=0;i<20000;i++)for(let j=0;j<s.length;j++)h=((h<<5)+h+s.charCodeAt(j)+i)|0;
  return 'fb'+(h>>>0).toString(16);
}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
const newOtp=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const isCollegeEmail=e=>{const d=e.split('@')[1].toLowerCase();return CONFIG.EMAIL_SUFFIXES.some(s=>d.endsWith(s))};
const strongPw=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p);
const loginFails={};
function startSession(u){S.session={userId:u.id,exp:Date.now()+CONFIG.SESSION_DAYS*864e5};DB.set('session',S.session)}
function requireUser(msg){
  const u=currentUser();
  if(!u){openAuth('signin',msg||t('login_needed'));return null}
  return u;
}
function collegeField(p,val){
  const known=COLLEGES.includes(val);const selv=val===''?'':known?val:'Other';
  return `<select id="${p}_col" class="inp" onchange="$('${p}_oth').classList.toggle('hidden',this.value!=='Other')"><option value="">Select your college</option>${opts(COLLEGES,selv)}</select><input id="${p}_oth" class="inp mt-2 ${selv==='Other'?'':'hidden'}" maxlength="60" placeholder="College name" value="${selv==='Other'&&!known?esc(val):''}">`;
}
function readCollege(p){const s=$(p+'_col').value;if(!s)return '';return s==='Other'?($(p+'_oth').value.trim()||'Other'):s}

function otpBanner(otp){return `<div class="rounded-xl border border-dashed border-amber-400 bg-amber-50 text-amber-900 text-xs p-3 mb-4"><b>Prototype mode:</b> no email server is connected, so the code is shown here. In production it is emailed to the student. Your code: <b class="text-base tracking-widest">${otp}</b></div>`}
async function startSignup(e){
  e.preventDefault();
  const name=$('su_name').value.trim(),email=$('su_email').value.trim().toLowerCase(),pw=$('su_pw').value,college=readCollege('su');
  if(name.length<2)return toast('Enter your full name','error');
  if(!validEmail(email))return toast('Enter a valid email','error');
  if(S.users.some(u=>u.email===email))return toast('This email is already registered. Please sign in.','error');
  if(!strongPw(pw))return toast('Password needs 8+ characters with letters and a number','error');
  if(!college)return toast('Select your college','error');
  state.pending={kind:'signup',name,email,pw,college,branch:$('su_branch').value,year:$('su_year').value,otp:newOtp(),exp:Date.now()+CONFIG.OTP_TTL,tries:0};
  showOtpStep('Verify your email');
}
function showOtpStep(title){
  const p=state.pending;
  $('authBox').innerHTML=`${otpBanner(p.otp)}<form onsubmit="verifyOtp(event)" class="space-y-3.5"><p class="text-sm font-bold">${esc(title)}</p><p class="text-xs muted">Enter the 6-digit code for <b>${esc(p.email)}</b>.</p>
  <input id="otp_in" class="inp text-center text-lg tracking-[.5em] font-extrabold" inputmode="numeric" maxlength="6" placeholder="••••••" required>
  ${p.kind==='reset'?'<div><label class="lbl">New password</label><input id="otp_pw" type="password" class="inp" minlength="8" autocomplete="new-password" required></div>':''}
  <button class="btn btn-primary w-full">Verify</button></form>`;
}
async function verifyOtp(e){
  e.preventDefault();const p=state.pending;if(!p)return;
  if(Date.now()>p.exp){state.pending=null;return toast('Code expired. Start again.','error')}
  if(++p.tries>5){state.pending=null;return toast('Too many wrong attempts. Start again.','error')}
  if($('otp_in').value.trim()!==p.otp)return toast('Incorrect code','error');
  if(p.kind==='signup'){
    const salt=newSalt();const hash=await hashPw(p.pw,salt);
    const first=!S.users.some(u=>!u.demo);
    const u={id:'u_'+uid(),name:p.name,email:p.email,salt,passHash:hash,college:p.college,branch:p.branch,year:p.year,verified:isCollegeEmail(p.email),emailVerified:true,role:first?'admin':'user',createdAt:Date.now(),blocked:[],phone:'',showWhatsapp:false,upi:''};
    S.users.push(u);save('users');startSession(u);state.pending=null;closeAllModals();renderChrome();route();
    toast(`Welcome aboard, ${u.name}!${first?' You are the first user, so you have moderator access.':''}`);
  }else{
    const npw=$('otp_pw').value;if(!strongPw(npw))return toast('Password needs 8+ characters with letters and a number','error');
    const u=userById(p.userId);if(!u)return;
    u.salt=newSalt();u.passHash=await hashPw(npw,u.salt);save('users');state.pending=null;
    toast('Password updated. Please sign in.');renderAuth('signin');
  }
}
function startReset(e){
  e.preventDefault();const email=$('fp_email').value.trim().toLowerCase();const u=S.users.find(x=>x.email===email&&!x.demo);
  if(!u)return toast('No account found with that email','error');
  state.pending={kind:'reset',userId:u.id,email,otp:newOtp(),exp:Date.now()+CONFIG.OTP_TTL,tries:0};showOtpStep('Reset password');
}
function quickLogin(uid){
  const u=userById(uid);if(!u)return;
  startSession(u);closeAllModals();renderChrome();route();toast(`Signed in as ${u.name}`);
}
async function doSignin(e){
  e.preventDefault();
  const email=$('si_email').value.trim().toLowerCase(),pw=$('si_pw').value;
  const lf=loginFails[email];
  if(lf&&lf.until>Date.now())return toast(`Too many attempts. Try again in ${Math.ceil((lf.until-Date.now())/1000)}s`,'error');
  const u=S.users.find(x=>x.email===email);
  const ok=u&&(u.demo&&pw==='demo1234'||(u.passHash&&await hashPw(pw,u.salt)===u.passHash));
  if(!ok){const f=loginFails[email]||(loginFails[email]={n:0,until:0});if(++f.n>=5){f.until=Date.now()+30000;f.n=0}return toast('Incorrect email or password','error')}
  if(u.banned)return toast('This account has been suspended by moderators.','error');
  delete loginFails[email];startSession(u);closeAllModals();renderChrome();route();toast(`Signed in as ${u.name}`);
}
function signOut(){S.session=null;DB.del('session');state.thread=null;renderChrome();location.hash='#/home';route();toast('Signed out','info')}

/* ---------- notifications ---------- */
function notify(userId,text,link){
  S.notifs.unshift({id:uid(),userId,text,link:link||'',ts:Date.now(),read:false});
  S.notifs=S.notifs.slice(0,300);
  const me=currentUser();
  if(me&&me.id===userId&&document.hidden&&'Notification' in window&&Notification.permission==='granted'){try{new Notification('Exchanger',{body:text,icon:'icon.svg'})}catch{}}
}
function badgeCounts(me){
  if(!me)return{req:0,msg:0,not:0};
  return{
    req:S.requests.filter(r=>(r.sellerId===me.id&&r.status==='pending')||(r.buyerId===me.id&&r.status==='accepted'&&!r.seen)).length,
    msg:S.messages.filter(m=>m.to===me.id&&!m.read).length,
    not:S.notifs.filter(n=>n.userId===me.id&&!n.read).length
  };
}
function runChecks(){
  const today=todayStr();let ch=false;
  S.requests.forEach(r=>{
    if(r.type!=='Rent'||!['accepted','active'].includes(r.status))return;
    const l=listingById(r.listingId);const title=l?l.title:'item';const d=daysBetween(today,r.end);
    if(r.status==='accepted'&&r.end<today&&!r.expN){
      r.expN=true;r.status='cancelled';ch=true;
      if(l)syncListing(l);
      [r.buyerId,r.sellerId].forEach(x=>notify(x,`Booking expired: Rental for "${title}" was never handed over and has been cancelled.`,'requests'));
      return;
    }
    if(d===1&&!r.rem1){r.rem1=true;ch=true;[r.buyerId,r.sellerId].forEach(x=>notify(x,`Return reminder: "${title}" is due tomorrow.`,'requests'))}
    if(d===0&&!r.rem0){r.rem0=true;ch=true;[r.buyerId,r.sellerId].forEach(x=>notify(x,`"${title}" is due back today.`,'requests'))}
    if(d<0&&r.status==='active'&&!r.overN){r.overN=true;ch=true;[r.buyerId,r.sellerId].forEach(x=>notify(x,`OVERDUE: "${title}" was due on ${fmtDay(r.end)}.`,'requests'))}
  });
  if(ch)save('requests','listings','notifs');
}
const isOverdue=r=>r.type==='Rent'&&r.status==='active'&&r.end<todayStr();

/* ---------- router ---------- */
const AUTH_VIEWS=['mine','saved','requests','messages','notifications','profile','admin'];
function route(){
  const v=(location.hash||'#/home').replace('#/','').split('/')[0]||'home';const me=currentUser();
  if(AUTH_VIEWS.includes(v)&&!me){state.view='home';renderView();openAuth('signin',t('login_needed'));return}
  if(v==='admin'&&me.role!=='admin'){state.view='home';renderView();return}
  state.view=(AUTH_VIEWS.includes(v)||v==='home')?v:'home';
  renderView();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function go(v){if(location.hash==='#/'+v)route();else location.hash='#/'+v}
function renderView(){
  const me=currentUser();
  if(AUTH_VIEWS.includes(state.view)&&!me){state.view='home';location.hash='#/home'}
  if(state.view==='admin'&&(!me||me.role!=='admin')){state.view='home';location.hash='#/home'}
  const m={home:renderHome,mine:renderMine,saved:renderSaved,requests:renderRequests,messages:renderMessages,notifications:renderNotifs,profile:renderProfile,admin:renderAdmin};
  (m[state.view]||renderHome)();renderChrome();
}

const imgOf=l=>(l.images&&l.images[0])||placeholderImg(l.category);
function priceLabel(l){
  if(l.type==='Exchange')return 'Exchange';
  if(l.type==='Rent')return `${money(l.price)} / ${l.rentUnit}`;
  return money(l.price)+(l.negotiable?' • Negotiable':'');
}
const typeClass=ty=>({Rent:'c-amber',Sale:'c-orange',Exchange:'c-green'}[ty]);
const statusClass=s=>({available:'c-green',reserved:'c-yellow',rented:'c-purple',sold:'c-red',exchanged:'c-red',paused:'c-slate'}[s]);
const condClass=c=>({'Brand New':'c-green','Like New':'c-teal','Good':'c-blue'}[c]||'c-slate');
function syncListing(l){
  if(!l||['paused','sold','exchanged'].includes(l.status))return;
  const rs=S.requests.filter(r=>r.listingId===l.id);
  if(rs.some(r=>r.status==='active'))l.status='rented';
  else if(l.type!=='Rent'&&rs.some(r=>r.status==='accepted'))l.status='reserved';
  else l.status='available';
}
function waLink(u,text){
  if(!u||!u.showWhatsapp||!/^\d{10}$/.test(u.phone||''))return '';

}

function renderChips(){
  const c=$('chips');if(!c)return;
  c.innerHTML=[{id:'All',icon:'fa-border-all'},...CATS].map(x=>`<button class="cat-btn ${F.cat===x.id?'on':''}" onclick="setF('cat','${x.id}')"><i class="fa-solid ${x.icon} mr-2 ${F.cat===x.id?'':'text-orange-500'}"></i>${x.id==='All'?t('all_items'):t(catKey(x.id))}</button>`).join('');
}
function getVisible(){
  const me=currentUser();const q=F.q.trim().toLowerCase();
  const a=S.listings.filter(l=>{
    const seller=userById(l.sellerId);
    if(seller&&seller.banned)return false;
    if(l.status==='paused'&&!(me&&me.id===l.sellerId))return false;
    if(F.hideSold&&['sold','exchanged'].includes(l.status))return false;
    if(isBlockedPair(me,l.sellerId))return false;
    if(F.cat!=='All'&&l.category!==F.cat)return false;
    if(F.type!=='all'&&l.type!==F.type)return false;
    if(F.scope==='mine'&&me&&l.college!==me.college)return false;
    if(F.location!=='all'&&l.location!==F.location)return false;
    if(F.sem!=='all'&&l.semester!=='Any'&&String(l.semester)!==String(F.sem))return false;
    if(F.branch!=='all'&&l.branch!=='Any'&&l.branch!==F.branch)return false;
    if(F.maxPrice!==''&&l.type!=='Exchange'&&l.price>Number(F.maxPrice))return false;
    if(q&&![l.title,l.desc,l.category,l.edition,l.location,l.college].join(' ').toLowerCase().includes(q))return false;
    return true;
  });
  if(F.sort==='price-low')a.sort((x,y)=>x.price-y.price);
  else if(F.sort==='price-high')a.sort((x,y)=>y.price-x.price);
  else a.sort((x,y)=>y.createdAt-x.createdAt);
  return a;
}

function setDetailImg(i){state.detailIdx=i;const el=$('detailMain');if(el)el.src=state.detailImgs[i]}

function renderCal(lid,y,m){
  const box=$('calBox');if(!box)return;state.cal={lid,y,m};
  const booked=new Set();
  S.requests.filter(r=>r.listingId===lid&&r.type==='Rent'&&['accepted','active'].includes(r.status)).forEach(r=>{for(let d=Date.parse(r.start);d<=Date.parse(r.end);d+=864e5)booked.add(new Date(d).toISOString().slice(0,10))});
  const pad=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),today=todayStr();
  let cells='';for(let i=0;i<pad;i++)cells+='<span></span>';
  for(let d=1;d<=dim;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<span class="cal-d ${booked.has(ds)?'cal-b':ds<today?'cal-p':'cal-f'}">${d}</span>`}

function compressImage(file,maxDim=900,q=.72){
  return new Promise((res,rej)=>{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej(new Error('Only JPG, PNG or WEBP images are allowed'));
    if(file.size>8*1024*1024)return rej(new Error('Image is larger than 8MB'));
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,maxDim/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that image'))};img.src=url;
  });
}
async function addFiles(files){
  for(const f of files){
    if(state.formImages.length>=CONFIG.MAX_PHOTOS){toast(`Max ${CONFIG.MAX_PHOTOS} photos`,'info');break}

}

function rentCost(l,start,end){const days=daysBetween(start,end)+1;const units=l.rentUnit==='day'?days:l.rentUnit==='week'?Math.ceil(days/7):days<=31?1:Math.ceil(days/30.42);return{days,units,total:units*l.price}}
function rentOverlap(lid,s,e,ignoreId){return S.requests.some(r=>r.listingId===lid&&r.id!==ignoreId&&r.type==='Rent'&&['accepted','active'].includes(r.status)&&s<=r.end&&e>=r.start)}
function openRequest(id){
  const me=requireUser('Sign in to send a request.');if(!me)return;
  const l=listingById(id);if(!l)return;
  const seller=userById(l.sellerId);

  if(isBlockedPair(me,l.sellerId))return toast('You cannot interact with this user','error');
  if(['sold','exchanged','paused'].includes(l.status))return toast('This listing is not available','error');
  if(S.requests.some(r=>r.listingId===id&&r.buyerId===me.id&&['pending','accepted','active'].includes(r.status)))return toast('You already have an open request for this item','info');
  const today=todayStr();
  closeAllModals();

  <form onsubmit="submitRequest(event,'${l.id}')" class="space-y-3.5">
  ${l.type==='Rent'?`<div class="grid grid-cols-2 gap-3"><div><label class="lbl">From</label><input type="date" id="rq_s" class="inp" min="${today}" value="${today}" onchange="$('rq_e').min=this.value;calcRent('${l.id}')" required></div><div><label class="lbl">Until</label><input type="date" id="rq_e" class="inp" min="${today}" value="${today}" onchange="calcRent('${l.id}')" required></div></div><div id="rq_sum" class="s2 rounded-xl p-3 text-xs font-semibold"></div>`:''}
  ${l.type==='Sale'?`<div><label class="lbl">${l.negotiable?'Your offer (₹)':'Price (₹)'}</label><input type="number" id="rq_price" class="inp" min="1" max="${l.price}" value="${l.price}" ${l.negotiable?'':'readonly'} required>${l.negotiable?`<p class="text-[11px] muted mt-1">Asking price is ${money(l.price)}. Fair offers get faster replies.</p>`:''}</div>`:''}
  ${l.type==='Exchange'?`<div><p class="text-xs s2 rounded-xl p-3 mb-3"><b>Seller wants:</b> ${esc(l.exchangeWant||'open to offers')}</p><label class="lbl">What will you offer?</label><input id="rq_off" class="inp" maxlength="200" placeholder="Describe your item" required></div>`:''}
  <div><label class="lbl">Message to seller (optional)</label><textarea id="rq_msg" rows="2" maxlength="300" class="inp" placeholder="Hi! I can meet at ${esc(l.location)} after 4 PM."></textarea></div>
  <button class="btn btn-primary w-full py-3">Send request</button><p class="text-[11px] muted text-center">The seller must accept before anything is final. Exchanger does not process payments.</p></form>`);
  if(l.type==='Rent')calcRent(l.id);
}
function calcRent(lid){
  const l=listingById(lid),s=$('rq_s').value,e=$('rq_e').value,box=$('rq_sum');if(!l||!box)return;
  if(!s||!e||e<s){box.innerHTML='<span class="text-rose-500">End date must be on or after the start date.</span>';return}
  if(rentOverlap(lid,s,e)){box.innerHTML='<span class="text-rose-500">These dates overlap an existing booking. Check the calendar.</span>';return}
  const c=rentCost(l,s,e);box.innerHTML=`${c.days} day(s) = ${c.units} ${l.rentUnit}(s) × ${money(l.price)} = <b>${money(c.total)}</b>${l.deposit?`<br>Plus refundable deposit <b>${money(l.deposit)}</b> • Total to hand over: <b>${money(c.total+l.deposit)}</b>`:''}`;
}
function submitRequest(e,lid){
  e.preventDefault();const me=currentUser(),l=listingById(lid);if(!me||!l)return;
  const seller=userById(l.sellerId);
  if(seller&&seller.banned)return toast('This seller account is suspended','error');
  if(l.sellerId===me.id||isBlockedPair(me,l.sellerId)||['sold','exchanged','paused'].includes(l.status))return toast('Request not possible','error');
  const r={id:'r_'+uid(),listingId:lid,buyerId:me.id,sellerId:l.sellerId,type:l.type,status:'pending',createdAt:Date.now(),paid:false,seen:false,deposit:0,total:0,price:0};
  const note=$('rq_msg').value.trim();let summary='';
  if(l.type==='Rent'){
    const s=$('rq_s').value,en=$('rq_e').value;
    if(s<todayStr()||en<s)return toast('Check your dates','error');
    if(rentOverlap(lid,s,en))return toast('Those dates are already booked','error');
    const c=rentCost(l,s,en);Object.assign(r,{start:s,end:en,total:c.total,deposit:l.deposit});summary=`Rental request: ${fmtDay(s)} to ${fmtDay(en)} (${money(c.total)}${l.deposit?` + ${money(l.deposit)} deposit`:''}).`;
  }else if(l.type==='Sale'){

    r.offering=$('rq_off').value.trim();if(r.offering.length<3)return toast('Describe what you are offering','error');summary=`Exchange proposal: I can offer "${r.offering}".`;
  }
  S.requests.unshift(r);
  S.messages.push({id:uid(),threadId:lid+':'+me.id,listingId:lid,from:me.id,to:l.sellerId,text:(summary+(note?'\n'+note:'')).slice(0,500),ts:Date.now(),read:false});
  notify(l.sellerId,`${me.name} sent a request for "${l.title}".`,'requests');
  if(!save('requests','messages','notifs'))return;
  closeAllModals();renderChrome();toast('Request sent. You will be notified when the seller responds.');
}
function renderRequests(){

    <div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-2 mb-1"><span class="chip ${typeClass(r.type)}">${t(r.type)}</span><span class="chip ${reqStatusClass(r.status)}">${t('rs_'+r.status)}</span>${od?'<span class="chip c-red"><i class="fa-solid fa-triangle-exclamation"></i>Overdue</span>':''}${r.paid?'<span class="chip c-teal">Payment received</span>':''}</div>
    <h3 class="font-bold">${esc(l?l.title:'Removed listing')}</h3>
    <p class="text-xs muted mt-1">${isSeller?'From':'To'}: <a href="javascript:void 0" class="font-bold text-orange-600" onclick="openProfile('${other?other.id:''}')">${esc(other?other.name:'Former user')}</a> • ${fmtTime(r.createdAt)}</p>
    <p class="text-sm font-semibold mt-1.5">${detail}</p>
    <div class="flex flex-wrap gap-2 mt-3">${btns.join('')}</div></div></div>`;
}
function upiLink(r){
  const l=listingById(r.listingId),s=userById(r.sellerId);if(!s||!s.upi)return '';
  const amt=r.type==='Rent'?r.total+r.deposit:r.type==='Sale'?r.price:0;if(!amt)return '';
  return `upi://pay?pa=${encodeURIComponent(s.upi)}&pn=${encodeURIComponent(s.name)}&am=${amt}&cu=INR&tn=${encodeURIComponent('Exchanger: '+(l?l.title.slice(0,40):'item'))}`;
}
function reqAction(id,act){
  const me=currentUser();if(!me)return;const r=S.requests.find(x=>x.id===id);if(!r)return;
  const l=listingById(r.listingId);const isSeller=r.sellerId===me.id,isBuyer=r.buyerId===me.id;
  if(!isSeller&&!isBuyer)return toast('Not allowed','error');
  const title=l?l.title:'item';const otherId=isSeller?r.buyerId:r.sellerId;
  const needSeller=['accept','decline','paid','handover','return'];
  if(needSeller.includes(act)&&!isSeller)return toast('Only the seller can do this','error');
  switch(act){
    case 'accept':
      if(r.status!=='pending')return;
      if(!l||['sold','exchanged','paused'].includes(l.status))return toast('Listing is no longer available','error');
      if(r.type==='Rent'&&rentOverlap(r.listingId,r.start,r.end,r.id))return toast('Those dates overlap another booking','error');
      if(r.type!=='Rent'&&S.requests.some(x=>x.listingId===r.listingId&&x.id!==r.id&&['accepted','active'].includes(x.status)))return toast('You have already accepted another request for this item','error');
      r.status='accepted';notify(otherId,`${me.name} accepted your request for "${title}". Arrange pickup in chat.`,'requests');break;
    case 'decline':if(r.status!=='pending')return;r.status='declined';notify(otherId,`Your request for "${title}" was declined.`,'requests');break;
    case 'cancel':
      if(!(r.status==='pending'&&isBuyer)&&!(r.status==='accepted'))return;
      r.status='cancelled';notify(otherId,`${me.name} cancelled the request for "${title}".`,'requests');break;
    case 'paid':r.paid=true;notify(otherId,`Seller confirmed your payment for "${title}".`,'requests');break;
    case 'handover':
      if(r.status!=='accepted')return;
      if(r.type==='Rent'){r.status='active';notify(otherId,`"${title}" handed over. Return by ${fmtDay(r.end)}.`,'requests')}
      else{r.status='completed';if(l)l.status=r.type==='Sale'?'sold':'exchanged';
        S.requests.filter(x=>x.listingId===r.listingId&&x.status==='pending').forEach(x=>{x.status='declined';notify(x.buyerId,`"${title}" is no longer available.`,'requests')});
        notify(otherId,`Deal completed for "${title}". Please leave a review.`,'requests')}
      break;
    case 'return':if(r.status!=='active')return;r.status='completed';notify(otherId,`"${title}" marked as returned. Please leave a review.`,'requests');break;
    default:return;
  }
  syncListing(l);
  if(!save('requests','listings','notifs'))return;
  renderView();toast('Updated');
}
function openReview(rid){
  const me=currentUser();const r=S.requests.find(x=>x.id===rid);if(!me||!r||r.status!=='completed'||![r.buyerId,r.sellerId].includes(me.id))return;
  if(S.reviews.some(v=>v.requestId===rid&&v.authorId===me.id))return toast('You already reviewed this deal','info');
  const other=userById(me.id===r.sellerId?r.buyerId:r.sellerId);state.rv=0;

}
function drawStars(){const b=$('rvStars');if(b)b.innerHTML=[1,2,3,4,5].map(i=>`<button type="button" onclick="state.rv=${i};drawStars()" aria-label="${i} star"><i class="fa-solid fa-star ${state.rv>=i?'star-on':'star-off'}"></i></button>`).join('')}
function submitReview(rid){

const tidOf=(lid,bid)=>lid+':'+bid;
function startChat(lid,buyerId){
  const me=requireUser('Sign in to chat with the seller.');if(!me)return;
  const l=listingById(lid);if(!l)return;
  const seller=userById(l.sellerId);
  if(seller&&seller.banned)return toast('This seller account is suspended','error');
  const bid=buyerId||(l.sellerId===me.id?null:me.id);if(!bid)return toast('Open a chat from the Messages page','info');
  const other=l.sellerId===me.id?bid:l.sellerId;
  if(isBlockedPair(me,other))return toast('You cannot message this user','error');
  state.thread=tidOf(lid,bid);closeAllModals();go('messages');
}
function threadsFor(me){
  if(!me)return[];
  const map={};
  S.messages.forEach(m=>{if(m.from!==me.id&&m.to!==me.id)return;const a=map[m.threadId];if(!a||a.ts<m.ts)map[m.threadId]=m});
  if(state.thread&&!map[state.thread])map[state.thread]={threadId:state.thread,ts:Date.now(),text:'',empty:true};
  return Object.entries(map).map(([id,last])=>{
    const[lid,bid]=id.split(':');const l=listingById(lid);const oid=l?(l.sellerId===me.id?bid:l.sellerId):(last.from===me.id?last.to:last.from);
    return{id,lid,bid,l,other:userById(oid),last,unread:S.messages.filter(m=>m.threadId===id&&m.to===me.id&&!m.read).length};
  }).filter(x=>x.other).sort((a,b)=>b.last.ts-a.last.ts);
}
function renderMessages(){
  const me=currentUser();if(!me){state.view='home';renderHome();return}
  const th=threadsFor(me);const act=state.thread?th.find(x=>x.id===state.thread):null;
  if(act&&S.messages.some(m=>m.threadId===act.id&&m.to===me.id&&!m.read)){S.messages.forEach(m=>{if(m.threadId===act.id&&m.to===me.id)m.read=true});save('messages');setTimeout(renderChrome,0)}
  const list=th.length?th.map(x=>`<button class="w-full text-left p-3 rounded-2xl flex gap-3 items-center ${act&&act.id===x.id?'s2':''}" onclick="state.thread='${x.id}';renderMessages()">${avatar(x.other,40)}<div class="min-w-0 flex-1"><p class="text-sm font-bold truncate">${esc(x.other.name)}</p><p class="text-[11px] text-orange-600 font-semibold truncate">${esc(x.l?x.l.title:'Removed listing')}</p><p class="text-xs muted truncate">${esc(x.last.text||'No messages yet')}</p></div>${x.unread?`<span class="chip c-orange">${x.unread}</span>`:''}</button>`).join(''):`<p class="text-sm muted p-4">No conversations yet. Open a listing and tap Chat.</p>`;
  let pane=`<div class="hidden md:flex items-center justify-center muted text-sm h-full p-10">Select a conversation</div>`;
  if(act){
    const wa=waLink(act.other,`Hi, about "${act.l?act.l.title:'your listing'}" on Exchanger.`);
    const msgs=S.messages.filter(m=>m.threadId===act.id).sort((a,b)=>a.ts-b.ts);
    pane=`<div class="flex flex-col h-[70vh]"><div class="flex items-center gap-3 p-3 border-b" style="border-color:var(--border)"><button class="md:hidden icon-btn" onclick="state.thread=null;renderMessages()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>${avatar(act.other,38)}<div class="min-w-0 flex-1"><p class="text-sm font-extrabold truncate cursor-pointer" onclick="openProfile('${act.other.id}')">${esc(act.other.name)}</p><p class="text-[11px] text-orange-600 font-semibold truncate cursor-pointer" onclick="${act.l?`openListing('${act.l.id}')`:''}">${esc(act.l?act.l.title:'Removed listing')}</p></div>${wa?`<a class="btn btn-green btn-sm" target="_blank" rel="noopener noreferrer" href="${esc(wa)}"><i class="fa-brands fa-whatsapp"></i></a>`:''}</div>
    <div id="msgList" class="flex-1 overflow-y-auto p-4 space-y-2">${msgs.length?msgs.map(m=>`<div class="flex"><div class="bubble ${m.from===me.id?'bub-me':'bub-them'}">${esc(m.text)}<div class="text-[9px] opacity-70 mt-1">${fmtTime(m.ts)}</div></div></div>`).join(''):'<p class="text-center text-xs muted mt-10">Say hello and agree on a pickup time.</p>'}</div>
    <div class="p-3 border-t" style="border-color:var(--border)"><div class="flex flex-wrap gap-1.5 mb-2">${['Is this still available?',`Can we meet at ${act.l?act.l.location:'the library'}?`,'Can you share more photos?'].map(q=>`<button class="chip c-slate !normal-case !tracking-normal" onclick="$('msgInput').value=this.textContent">${esc(q)}</button>`).join('')}</div>
    <form class="flex gap-2" onsubmit="sendMsg(event)"><input id="msgInput" class="inp" maxlength="500" placeholder="Type a message" autocomplete="off" required><button class="btn btn-primary" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></form>
    <p class="text-[10px] muted mt-2"><i class="fa-solid fa-shield-halved mr-1"></i>Never share OTPs, passwords or bank details in chat.</p></div></div>`;
  }
  $('view').innerHTML=pageWrap(t('messages'),'',`<div class="surface rounded-3xl overflow-hidden grid md:grid-cols-3"><div class="${act?'hidden md:block':''} md:border-r p-2 max-h-[70vh] overflow-y-auto" style="border-color:var(--border)">${list}</div><div class="md:col-span-2 ${act?'':'hidden md:block'}">${pane}</div></div>`);
  const ml=$('msgList');if(ml)ml.scrollTop=ml.scrollHeight;
}
function sendMsg(e){
  e.preventDefault();const me=currentUser();if(!me||!state.thread)return;
  const[lid,bid]=state.thread.split(':');const l=listingById(lid);
  if(l&&me.id!==bid&&me.id!==l.sellerId)return toast('Not allowed','error');
  const pastMsgs=S.messages.filter(m=>m.threadId===state.thread);
  const otherMsg=pastMsgs.find(m=>m.from===me.id?m.to:m.from);
  const fallbackTo=otherMsg?(otherMsg.from===me.id?otherMsg.to:otherMsg.from):(l?(me.id===bid?l.sellerId:bid):bid);
  const to=l?(me.id===bid?l.sellerId:bid):fallbackTo;
  if(!to||isBlockedPair(me,to))return toast('You cannot message this user','error');
  const text=$('msgInput').value.trim().slice(0,500);if(!text)return;
  const hadUnreadFromMe=pastMsgs.some(m=>m.from===me.id&&!m.read);
  S.messages.push({id:uid(),threadId:state.thread,listingId:lid,from:me.id,to,text,ts:Date.now(),read:false});
  if(!hadUnreadFromMe)notify(to,`New message from ${me.name}${l?` about "${l.title}"`:''}.`,'thread:'+state.thread);
  if(!save('messages','notifs'))return;renderMessages();const i=$('msgInput');if(i)i.focus();
}

}
function renderAdmin(){
  const me=currentUser();if(!me||me.role!=='admin'){state.view='home';renderHome();return}
  const open=S.reports.filter(r=>r.status==='open');
  const rrow=r=>{const l=r.kind==='listing'?listingById(r.targetId):null;const u=r.kind==='user'?userById(r.targetId):(l?userById(l.sellerId):null);const rep=userById(r.reporterId);
    return `<div class="surface rounded-2xl p-4"><div class="flex flex-wrap gap-2 items-center mb-1"><span class="chip c-red">${esc(r.reason)}</span><span class="chip c-slate">${r.kind}</span><span class="text-[11px] muted">${fmtTime(r.ts)} • by ${esc(rep?rep.name:'?')}</span></div>
    <p class="text-sm font-bold">${r.kind==='listing'?esc(l?l.title:'(deleted listing)'):esc(u?u.name:'(deleted user)')}</p>${r.text?`<p class="text-xs mt-1">${esc(r.text)}</p>`:''}
    <div class="flex flex-wrap gap-2 mt-3">${l?`<button class="btn btn-soft btn-sm" onclick="openListing('${l.id}')">View</button><button class="btn btn-danger btn-sm" onclick="deleteListing('${l.id}')">Remove listing</button>`:''}${u&&u.id!==me.id?`<button class="btn btn-danger btn-sm" onclick="toggleBan('${u.id}')">${u.banned?'Unsuspend':'Suspend'} user</button>`:''}<button class="btn btn-soft btn-sm" onclick="resolveReport('${r.id}')">Dismiss</button></div></div>`};
  const users=S.users.filter(u=>!u.demo);
  $('view').innerHTML=pageWrap(t('admin'),'Review reports and manage users',`<h3 class="font-extrabold mb-3">Open reports (${open.length})</h3><div class="space-y-3 mb-8">${open.length?open.map(rrow).join(''):'<p class="text-sm muted">No open reports.</p>'}</div>
  <h3 class="font-extrabold mb-3">Students (${users.length})</h3><div class="surface rounded-2xl divide-y mb-8" style="--tw-divide-opacity:1">${users.map(u=>`<div class="p-3 flex items-center gap-3" style="border-color:var(--border)">${avatar(u,34)}<div class="min-w-0 flex-1"><p class="text-sm font-bold truncate">${esc(u.name)} ${u.role==='admin'?'<span class="chip c-purple">Mod</span>':''}${u.banned?'<span class="chip c-red">Suspended</span>':''}</p><p class="text-[11px] muted truncate">${esc(u.email)} • ${esc(u.college)}</p></div>${u.id!==me.id?`<button class="btn btn-soft btn-sm" onclick="toggleBan('${u.id}')">${u.banned?'Unsuspend':'Suspend'}</button>`:''}</div>`).join('')}</div>
  <button class="btn btn-danger" onclick="removeSample()">Remove all sample listings and users</button>`);
}
function resolveReport(id){const r=S.reports.find(x=>x.id===id);if(r){r.status='resolved';save('reports');renderView()}}
function toggleBan(id){const me=currentUser();if(!me||me.role!=='admin'||id===me.id)return;const u=userById(id);if(!u)return;u.banned=!u.banned;save('users');closeAllModals();renderView();toast(u.banned?'User suspended':'User restored','info')}
function removeSample(){
  const me=currentUser();if(!me||me.role!=='admin'||!confirm('Remove all sample data?'))return;
  const demoUserIds=S.users.filter(u=>u.demo).map(u=>u.id);
  const demoListingIds=S.listings.filter(l=>l.demo).map(l=>l.id);
  S.listings=S.listings.filter(l=>!l.demo);S.users=S.users.filter(u=>!u.demo);
  S.requests=S.requests.filter(r=>listingById(r.listingId)&&!demoUserIds.includes(r.buyerId)&&!demoUserIds.includes(r.sellerId));
  S.messages=S.messages.filter(m=>listingById(m.listingId)&&!demoUserIds.includes(m.from)&&!demoUserIds.includes(m.to));
  S.reports=S.reports.filter(r=>!demoUserIds.includes(r.reporterId)&&!demoUserIds.includes(r.targetId)&&!demoListingIds.includes(r.targetId));
  S.reviews=S.reviews.filter(v=>!demoUserIds.includes(v.authorId)&&!demoUserIds.includes(v.targetId));
  save(...KEYS);renderView();toast('Sample data removed','info');
}

/* ---------- info pages ---------- */
function openInfo(k){
  const P={
  safety:['Campus Safety',`<ul class="list-disc pl-5 space-y-2"><li>Meet in busy public campus spots such as the canteen, library or hostel gate, in daylight where possible.</li><li>Inspect the item before you pay or hand over a deposit. Test calculators, check book pages, ride the cycle.</li><li>Never share OTPs, passwords, Aadhaar or bank details in chat. Exchanger staff will never ask for them.</li><li>Pay only by UPI after inspection. Exchanger does not hold or verify payments.</li><li>For rentals, agree on dates, deposit and condition in chat first, and take a photo at handover and return.</li><li>Use Report or Block if anything feels off.</li></ul>`],
  faq:['FAQ',`<div class="space-y-4"><div><b>Is it free?</b><p>Yes. There is no platform commission.</p></div><div><b>How does renting work?</b><p>Pick dates on a listing, send a request, and the seller accepts. They mark the item handed over and later returned. The calendar blocks double bookings and you get return reminders.</p></div><div><b>What is the deposit?</b><p>A refundable amount agreed with the seller, returned when the item comes back in the same condition.</p></div><div><b>Do I need a college email?</b><p>No. Any email works, and we verify it with a 6-digit code. If you sign up with a .ac.in, .edu.in or .edu address you also get a Verified student badge, which helps buyers and sellers trust you. Be extra careful with accounts that only have the Email verified tag.</p></div><div><b>Can I negotiate?</b><p>If a seller marks a price negotiable, use Buy / Make an Offer to propose your price.</p></div><div><b>What happens on overdue returns?</b><p>Both sides get an overdue alert and the request is flagged. Resolve it in chat, and report repeated problems.</p></div></div>`],
  terms:['Terms of Use',`<div class="space-y-3"><p>By using Exchanger you confirm that the college and details you enter are true. Only accounts signed up with a college email carry the Verified student badge.</p><p>List only items you own and can legally lend or sell. Prohibited: stolen goods, weapons, alcohol, drugs, counterfeit products, exam papers or leaked material, and anything illegal in India.</p><p>Deals are between students. Exchanger is a listing and messaging platform and is not responsible for item quality, payment disputes or losses. Inspect before you pay.</p><p>Moderators may remove listings or suspend accounts that break these rules. Be respectful. Harassment is not tolerated.</p><p class="text-xs muted">Prototype notice: replace this text with terms reviewed by a lawyer before launch.</p></div>`],
  privacy:['Privacy',`<div class="space-y-3"><p><b>What we store:</b> your name, college email, college, branch, year, optional phone and UPI ID, your listings, messages, requests and reviews.</p><p><b>Who sees what:</b> other students see your name, college, year, branch, ratings and listings. Your email is never shown. Your phone number is never displayed, only used for an optional WhatsApp chat link for signed-in students if you turn it on.</p><p><b>Your control:</b> edit your profile anytime, block users, and delete your account from the Profile page to remove your data.</p><p class="text-xs muted">Prototype notice: in this version everything is stored in your own browser. When you connect a real backend, update this policy to describe where data is hosted.</p></div>`]
  };
  openModal(`<h3 class="text-xl font-extrabold mb-4">${P[k][0]}</h3><div class="text-sm leading-relaxed">${P[k][1]}</div>`);
}

/* ---------- cross-tab sync, init ---------- */
window.addEventListener('storage',e=>{
  if(!e.key||!e.key.startsWith('exch2_'))return;
  loadState();renderChrome();
  if($('modalRoot').children.length)return;
  if(AUTH_VIEWS.includes(state.view)&&!currentUser()){state.view='home';location.hash='#/home';renderHome();return}
  if(state.view==='messages'){const v=$('msgInput')?$('msgInput').value:'';renderMessages();if(v&&$('msgInput'))$('msgInput').value=v}
  else if(state.view!=='home')renderView();else renderGrid();
});
async function init(){
  loadState();seedIfEmpty();applyTheme();
  if(!S.session||S.session.exp<Date.now()){S.session=null;DB.del('session')}
  await syncFromServer();
  runChecks();renderChrome();route();
  setInterval(()=>{runChecks();renderChrome()},60000);
  setInterval(syncFromServer,3000);
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
